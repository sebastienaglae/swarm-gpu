<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2367e8f9' d='M32 4 58 19v26L32 60 6 45V19zm0 9L14 23v18l18 10 18-10V23z'/%3E%3C/svg%3E"
    />
    <meta name="description" content="SwarmGPU — a raw WebGPU renderer for GPU-driven swarms." />
    <title>SwarmGPU</title>
  </head>
  <body>
    <main id="app">
      <canvas id="gpu-canvas" aria-label="SwarmGPU rendering canvas"></canvas>
      <section id="status-panel" class="status-panel" aria-live="polite">
        <p class="eyebrow">SWARMGPU / FOUNDATION</p>
        <h1 id="status-title">Initializing WebGPU</h1>
        <p id="status-message">Checking browser and adapter capabilities…</p>
        <button id="retry-button" type="button" hidden>Retry initialization</button>
      </section>
      <aside id="diagnostics" class="diagnostics" aria-label="Renderer diagnostics" hidden>
        <div><span>State</span><output id="metric-state">idle</output></div>
        <div><span>Adapter</span><output id="metric-adapter">—</output></div>
        <div><span>Canvas</span><output id="metric-canvas">0 × 0</output></div>
        <div><span>Max instances</span><output id="metric-capacity">—</output></div>
        <div><span>Timestamp query</span><output id="metric-timestamp">—</output></div>
        <div><span>Instances</span><output id="metric-instances">—</output></div>
        <div><span>Triangles</span><output id="metric-triangles">—</output></div>
        <div><span>Draw calls</span><output id="metric-draws">—</output></div>
        <div><span>Compute dispatches</span><output id="metric-dispatches">—</output></div>
        <div><span>State memory</span><output id="metric-memory">—</output></div>
        <div><span>FPS</span><output id="metric-fps">—</output></div>
        <div><span>Frame interval</span><output id="metric-frame">—</output></div>
        <div><span>CPU encode + submit</span><output id="metric-cpu">—</output></div>
        <div><span>GPU frame</span><output id="metric-gpu">not measured</output></div>
      </aside>
      <nav id="controls" class="controls" aria-label="Renderer lifecycle" hidden>
        <label>
          Population
          <select id="population-select">
            <option value="100000">100,000</option>
            <option value="250000">250,000</option>
            <option value="500000" selected>500,000</option>
            <option value="1000000">1,000,000</option>
          </select>
        </label>
        <label>
          Pointer force
          <select id="interaction-mode">
            <option value="disabled">Disabled</option>
            <option value="attract" selected>Attract</option>
            <option value="repel">Repel</option>
          </select>
        </label>
        <label>
          Strength
          <input id="interaction-strength" type="range" min="0" max="40" step="1" value="18" />
        </label>
        <label>
          Radius
          <input id="interaction-radius" type="range" min="4" max="60" step="1" value="24" />
        </label>
        <button id="pause-button" type="button">Pause</button>
        <button id="reset-button" type="button">Reset</button>
      </nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
